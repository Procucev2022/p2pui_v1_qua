# Pull request quality gate
# Runs on every PR: lint, typecheck, build, unit tests, and 90% per-file coverage.

name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build -- --configuration=development

      - name: Unit tests with coverage
        env:
          CI: 'true'
          TEST_CI: 'true'
        run: |
          echo "CHROME_BIN=${CHROME_BIN:-$(which chrome || which google-chrome || true)}"
          export CHROME_BIN="${CHROME_BIN:-$(which chrome || which google-chrome)}"
          npm run test:coverage

      - name: Enforce 90% per-file coverage
        run: npm run coverage:check

      - name: Build PR comment summary
        if: always()
        run: npm run test:summary

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
          if-no-files-found: warn

      - name: Comment coverage & test summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/pr-comment.md';
            let body = '## Unit test & coverage summary\n\n_Summary file was not generated._';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            }
            const marker = '<!-- pr-quality-coverage-bot -->';
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
