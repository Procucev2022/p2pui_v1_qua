# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - qua

on:
  push:
    branches:
      - prodMaster
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        env:
          NODE_ENV: production
          BACKEND_URL: ${{ secrets.QUA_BACKEND_URL || secrets.PROD_BACKEND_URL || secrets.BACKEND_URL || 'https://quaservicesp.procucev.com' }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.QUA_STORAGE_ENCRYPTION_KEY || secrets.PROD_STORAGE_ENCRYPTION_KEY || secrets.STORAGE_ENCRYPTION_KEY || 'perm' }}
          BASIC_AUTH_TOKEN: ${{ secrets.QUA_BASIC_AUTH_TOKEN || secrets.PROD_BASIC_AUTH_TOKEN || secrets.BASIC_AUTH_TOKEN || 'Basic cHJvY3VjZXY6cHJvY3VjZXY=' }}
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_466AAD07168F4106A92943F5EA80BB06 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06294C284AA34971B5CA442E183F0C4C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2CB3744D3F44DDCB7F6ABB320059198 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qua'
          slot-name: 'Production'
          package: .

          
