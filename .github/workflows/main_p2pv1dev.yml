# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - p2pv1dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        env:
          NODE_ENV: development
          PRODUCTION: 'false'
          # Environment-specific names take precedence over the generic ones so a
          # repository-level BACKEND_URL cannot silently retarget this deployment.
          BACKEND_URL: ${{ vars.DEV_BACKEND_URL || secrets.DEV_BACKEND_URL || vars.BACKEND_URL || secrets.BACKEND_URL || 'https://p2pv1servicesdev-etfrcte5fhdvfrd4.centralindia-01.azurewebsites.net' }}
          STORAGE_ENCRYPTION_KEY: ${{ vars.DEV_STORAGE_ENCRYPTION_KEY || secrets.DEV_STORAGE_ENCRYPTION_KEY || vars.STORAGE_ENCRYPTION_KEY || secrets.STORAGE_ENCRYPTION_KEY || 'perm' }}
          BASIC_AUTH_TOKEN: ${{ vars.DEV_BASIC_AUTH_TOKEN || secrets.DEV_BASIC_AUTH_TOKEN || vars.BASIC_AUTH_TOKEN || secrets.BASIC_AUTH_TOKEN || '' }}
          PROXY_TARGET: ${{ vars.PROXY_TARGET || vars.BACKEND_URL || secrets.BACKEND_URL || 'https://p2pv1servicesdev-etfrcte5fhdvfrd4.centralindia-01.azurewebsites.net' }}
        run: |
          npm install --legacy-peer-deps --include=dev
          # Explicit configuration: this is what `ng build` already resolved to
          # via angular.json defaultConfiguration, now stated outright so the
          # deployed bundle is never ambiguous.
          npm run build -- --configuration=production

      # The Angular application is emitted to dist/p2pui-gmtbfs. Azure must
      # receive THAT directory as the site root - not the repository root.
      # server.js serves it on Linux, web.config serves it on Windows/IIS, and
      # the runtime package.json replaces the app manifest so Azure can never
      # fall back to `npm start` -> `ng serve --port 4201`.
      - name: Stage Azure deployment package
        run: |
          set -euo pipefail
          DIST_DIR="dist/p2pui-gmtbfs"
          test -f "$DIST_DIR/index.html" || { echo "::error::Angular build output missing at $DIST_DIR"; exit 1; }
          cp deploy/server.js    "$DIST_DIR/server.js"
          cp deploy/web.config   "$DIST_DIR/web.config"
          cp deploy/package.json "$DIST_DIR/package.json"
          echo "Staged deployment package contents:"
          ls -la "$DIST_DIR"

      - name: Verify deployment package
        run: node scripts/verify-deploy-package.js dist/p2pui-gmtbfs

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Only the built application, so no source, node_modules, .git or
          # generated environment files leave the build job.
          path: dist/p2pui-gmtbfs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: development
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_180536A5717B4ACE8BDFF8D433B9519F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_75DABA1CCAF8430DBA8ADB87B7C987A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C39826CF8C4441F3B0032276D96FCEEF }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'p2pv1dev'
          slot-name: 'Production'
          package: site
