    <div class="col-12 mt-3 mr-3" style="display: flex;align-items: center;flex-direction: row-reverse;    position: fixed;
    bottom: 16px;right: 16px;"  >
    <button class="btn btn-orange ml-3" type="button"   (click)="onForwardRFQ()" [disabled]="(vendorGridData.gridValue.length<=0 )">{{ this.isRFQFORWARD == true ? 'Send RFQ' : 'Invite RFQ' }} </button>
   </div>
    <ng-template #otpTemplate>
        <div class="modal-header">
            <h5 class="modal-title">Choose Vendors</h5>
            <button type="button" class="close" aria-label="Close" (click)="dialog.closeAll()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <p>Please choose vendors from the list below:</p>
            <div class=" " *ngIf="vendorList && vendorList.length > 0">
            <app-vendor-choose-modal-popup  [parentData]="vendorChoosePopupData" [vendorList]="vendorList"
                        [parentData]="{
                            companyId: companyId,
                            rfqId: rfqId, 
                            vendorHeaders: vendorSearchTableHeaders
                        }"
            (onClosePopup)="onCloseVendorChoosePopup($event)"
            (onAddNewVendor)="onAddNewVendor($event)"
            ></app-vendor-choose-modal-popup>
            </div>
          
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="dialog.closeAll()">Close</button>
        </div>
    </ng-template>
</div>
