
<div class="col-12 pad-nill">
  <div class="table-title">
    <div class="row">
      <div class="col-sm-6">
        <h2>PR Reports</h2>
      </div>
      <div class="col-sm-6">
      </div>
    </div>
  </div>
  <!-- <div class="col-12"> -->

<div class="col-12 row">

  <div class="col-2">
    <label for="dueDate" class="col-sm-12 title">From: <b style="color: red;">*</b></label>
    <div class="col-sm-12">
        <mat-form-field class="example-full-width">
            <mat-label>Choose a date</mat-label>
            <input matInput  [matDatepicker]="picker" name="fromDate" ngModel id="i_phone" [(ngModel)]="fromDate" required>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>
  </div>

  <div class="col-2">
    <label for="dueDate" class="col-sm-12 title">To: <b style="color: red;">*</b></label>
    <div class="col-sm-12">
        <mat-form-field class="example-full-width">
            <mat-label>Choose a date</mat-label>
            <input matInput  [min]="fromDate"  [matDatepicker]="picker1" name="toDate" ngModel id="i_phone" [(ngModel)]="toDate" required>
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
    </div>
  </div>
  <div class="col-2" *ngIf="loggedUserData.role.description === 'CategoryManager'" style="margin-top: 12px;">
    <label for="userName" class="col-sm-12 title">Client Name :</label>
    <p-autoComplete   styleClass="form-control" inputStyleClass="p-auto-cls" panelInputClass="p-auto-panel-cls" [suggestions]="filteredClientList" (completeMethod)="filterClient($event)" field="companyName" [dropdown]="true"
    (onSelect)="getUserNamesandDeptForCM($event)">
     <ng-template let-client pTemplate="item">
         <div class="pr-item">
             <div>{{client.companyName}}</div>
         </div>
     </ng-template>
    </p-autoComplete>
  </div>

  <div class="col-2" *ngIf="loggedUserData.role.description === 'clientInitiator'  || clientName != undefined">
    <label for="userName" class="col-sm-12 title">UserName :</label>
    <div class="col-sm-12">
        <select name="userName" class="form-control dropdown-style" [(ngModel)]="userName">
                <option  [value]="undefined" selected disabled>select username</option>
                <option *ngFor="let userName of userNames" [value]="userName">
                    {{userName}}</option>
        </select>
    </div>
  </div>

  <div class="col-2" *ngIf="loggedUserData.role.description === 'clientInitiator'  || clientName != undefined">
    <label for="userName" class="col-sm-12 title">Department :</label>
    <div class="col-sm-12">
        <select name="department" class="form-control dropdown-style" [(ngModel)]="department" >
                <option  [value]="undefined" selected disabled>select department</option>
                <option *ngFor="let department of departments" [value]="department.department">
                    {{department.department}}</option>
        </select>
    </div>
  </div>

  <div class="col-2">
    <div class="text-center">
      <button type="button" class="btn btn-primary btn-blue"  style="margin-top:55px" (click)="downloadPRreport()" [disabled] = "fromDate == null || toDate == null"> <img class="cursor-pointer ml-3" src="/assets/images/new/download.svg" width="20" height="20"   aria-hidden="true"  /> Download Report</button>
    </div>
  </div>




</div>
