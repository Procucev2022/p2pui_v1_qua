<div class="col-12">

  <p-table #prTable [columns]="bidItemsHeaders" [value]="bidItemsList" [scrollable]="true" sortMode="multiple" [paginator]="true" [rows]="pageRecordSize"  id="prTable"
  [rowsPerPageOptions]="pageOptions"  [style]="{width:'100%'}" exportFilename="roles details">
  <ng-template pTemplate="caption">
    <div class="searchPanel">
      <input type="text" pInputText size="50" placeholder="Search.."
        (input)="prTable.filterGlobal($event.target.value, 'contains')" style="width:auto; float: right;" />
    </div>
  </ng-template>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <!-- <th style="width: 3em">
        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
      </th> -->
      <th *ngFor="let col of columns" [pSortableColumn]="col.field" 
      [style.width]="col.width">
        {{col.header}}
        <p-sortIcon [field]="col.field"></p-sortIcon>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-columns="columns" let-rowData>
    <tr [pSelectableRow]="rowData" >
      <!-- <td style="width: 3em">
        <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
      </td> -->
      <td *ngFor="let col of columns" [style.width]="col.width">
        <span *ngIf="!col.isLink"> {{rowData[col.field]}}</span>
        <span *ngIf="col.isLink" class="cellLinkCls"> <a href="javascript:void(0);" > {{rowData[col.field]}} </a></span>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage" let-columns>
    <tr>
      <td [attr.colspan]="5" style="text-align:center;">
        No Records Found.
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="paginatorleft">
    <div *ngIf="prTable._totalRecords > 0">
      <b>Showing {{prTable.first+1}} to {{prTable.first+prTable.rows > prTable.totalRecords?prTable.totalRecords: prTable.first+prTable.rows}} of {{prTable.totalRecords}}</b>
      <!-- <app-page-info [totalRecords]="bidItemsList.length" [pageData]="paginatoryDetails"></app-page-info> -->
    </div>
  </ng-template>
</p-table>
</div>
