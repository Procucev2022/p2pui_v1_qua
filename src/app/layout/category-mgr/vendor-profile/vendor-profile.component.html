 
<div class="container-fluid">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6">
          <h2 class="text-center">My Profile</h2>
          <!-- <p><span class="dot"></span>{{itemList.length}} Total</p> -->
        </div> 
         <div class="col-12"  >
            <p-steps [model]="stepsList" styleClass="steps-custom" [activeIndex]="currentStep-1"></p-steps>
        </div>
      </div>
    </div>
    <div  [hidden]="!isFirstScreen">
        <form class="row" (ngSubmit)="updateVendorForm()"  [formGroup]="vendorForm" novalidate>
            <div class="col-6">
                <div class="form-group ">
                    <label for="name" class="required"
                    >Your Name</label>
                    <input type="text" class="form-control" formControlName="companyName"/>
                </div>
            </div>
             <div class="col-6">
                <div class="form-group">
                    <label for="name" class="required">EMail Id</label>
                    <input type="text" class="form-control" formControlName="email" disabled/>
                </div>
            </div>
             <div class="col-6">
                <div class="form-group">
                    <label for="name" class="required">Mobile Number</label>
                    <input type="text" class="form-control" formControlName="organizationPhonenumber" disabled/>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group">
                    <label for="name">GSTIN</label>
                    <input type="text" required id="gstin" class="form-control" name="gstin" formControlName="gstin"
                            placeholder="GSTIN" />
                        <div style="color: #fff"
                            *ngIf="vendorForm?.controls?.gstin?.touched && vendorForm?.controls?.gstin?.errors?.invalidGstin">
                            Invalid GSTIN format </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group ">
                    <label for="name" class="required">Registered Office Address (City)</label>
                    <textarea type="text" class="form-control" formControlName="city"></textarea>
                </div>
            </div>
             <div class="col-6">
                <div class="form-group required">
                    <label for="name" class="required">ZipCode</label>
                   <input type="text" required id="zipCode" class="form-control" name="zipCode"
                            formControlName="zipCode" placeholder="ZipCode (6digits)" maxlength="6"
                            (keypress)="numberOnly($event)" />
                        <div
                            *ngIf="(vendorForm.controls?.zipCode?.touched) && vendorForm.controls?.zipCode.status=='INVALID'">
                            <div style="color: #fff">ZipCode (6digits) is required</div>
                        </div>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label for="name">Product & Service Categories</label>
                    <input type="text" class="form-control" formControlName="details" placeholder="Product & Service Categories seperated by ,"/>
                </div>
            </div>
            <div class="col-12" *ngIf="isShowDivisions"> 
                 <div formArrayName="divisionCategories" style="    border: 2px solid #8080804a;
    margin-top: 1rem;">
                    <label style="font-weight: bold;" class="mt-3">Select Divisions & Categories:</label>
                    <div *ngFor="let group of items.controls; let i = index" [formGroupName]="i" class="row border p-1 m-3 pb-3" style="background: #6a9adf2b;
    border-radius: 4px;">
                            <div class="col-6"  >
                                <label class="form-label " style="display: block;font-weight: bold;">Division : </label>
                                <!-- <p-autoComplete  formControlName="division" showEmptyMessage="true"
                                [emptyMessage]="'No data available'" styleClass="form-control" inputStyleClass="p-auto-cls"
                                    [suggestions]="divisionFormList[index].filtered_divisionList" panelInputClass="p-auto-panel-cls" [minLength]="1"
                                    [dropdown]="true"
                                    (completeMethod)="filterAutoCompleteData($event, 'divisionsList' ,  true, index)"
                                      (onSelect)="onItemSelected($event, i)" placeholder="Select Division"
                                    >
                                            <ng-template let-segment pTemplate="item">
                                                <div class="segment-item">
                                                    <div>{{segment}}</div>
                                                </div>
                                            </ng-template>
                                </p-autoComplete> --> 
                                <select class="form-control" name="se1" formControlName="division"
                                  (change)="filterCategoryListByDivision($event, i)">
                                    <option     value="">--Select--</option>
                                    <option *ngFor="let val of divisionFormList[i].divisionList" value="{{val}}">{{val}}</option>
                                </select>
                            </div>
                            <div class="col-12"  >
                                <label class="form-label  " style="display: block;font-weight: bold;">Choose Category :</label>
                                  <ul class="five-column-list" *ngIf="divisionFormList[i].categoryList?.length > 0">
                                    <li *ngFor="let val of divisionFormList[i].categoryList; let j = index;" style="margin-right: 10px;" class="form-check form-check-inline">
                                        <input type="checkbox" style="width: 20px;height: 20px;;" [value]="val"  id="d1_cat_{{j}}_{{val}}"  
                                        (click)="onCategoryChange($event, i)" [checked]="isMatchedCategory(i, val)"  />
                                         <label style="margin-right: 5px;" for="d1_cat_{{j}}_{{val}}">{{val}}</label>

                                    </li>
                                </ul>
                                 <!-- <select class="form-control" name="se1" formControlName="category">
                                    <option     value="">--Select--</option>
                                    <option *ngFor="let val of divisionFormList[i].categoryList" value="{{val}}">{{val}}</option>
                                </select>  -->
                            </div>
                    </div>
                </div>

            </div>
            <div class="col-12 mt-3">
                
                <div formArrayName="branches" style="border:2px solid #8080804a; margin-top: 1rem;">
                    <label style="font-weight: bold;">Branches Details:</label>
                    <div *ngFor="let address of branches.controls; let i = index" [formGroupName]="i" class="row border p-1 m-3 pb-3" [ngClass]="{'mt-3': i>0}" style="background: #6a9adf2b;
    border-radius: 4px;">
                            <div class="col-2">Branch Name</div> 
                            <div class="col-2">Contact Person</div>
                            <div class="col-2">EmailId</div>
                            <div class="col-3">Address</div>
                            <div class="col-3"></div> 
                            <div class="col-2"> 
                                <input formControlName="branchName" class="form-control" placeholder="Branch Name" />
                            </div>
                            <div class="col-2"> 
                                <input formControlName="contactPerson" class="form-control"  placeholder="Contact Person" />
                            </div>
                            <div class="col-2"> 
                                <input formControlName="email" class="form-control"  placeholder="EmailId" />
                            </div>
                            <div class="col-3"> 
                                <input formControlName="address" class="form-control"  placeholder="Address"/>
                            </div> 
                            <div class="col-3">
                                <button type="button" class="btn btn-secondary" (click)="addBranch()">Add 1+ More</button>
                                <button type="button" *ngIf="i >0" class="btn btn-danger" (click)="removeBranch(i)">Remove</button>
                            </div>
                       </div>
                </div>

            </div>
            
            
            <div class="col-12 mt-3 mb-3" style="display: flex; direction: rtl;">
                   <button type="button" class="btn btn-blue" (click)="updateVendorForm()">Update My Data </button>
                <button type="button" class="btn btn-red" (click)="resetToOriginalState()">Reset To Previous Version</button>
            </div>
        </form>
        <!-- <div class="col-12">
             <div class="col-sm-6" style="display: inline-flex;align-items: center;" >
            <label style="width: 175px; font-weight: 600;">Division By</label>
            <select class="form-control" name="se1" [(ngModel)]="vendorRegObj.division" (change)="filterRFQsBYDivision()"> 
                <option *ngFor="let val of divisionsList">{{val}}</option>
            </select>
          </div>
          <div class="col-sm-6" style="display: inline-flex;align-items: center;" >
            <label style="width: 175px; font-weight: 600;">Category By</label>
            <select class="form-control" name="se1" [(ngModel)]="vendorRegObj.category" > 
                <option *ngFor="let val of categoryList">{{val}}</option>
            </select>
          </div>
        </div> -->
    </div>
   
</div>
