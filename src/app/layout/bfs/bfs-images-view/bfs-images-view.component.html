<i class="fa fa-info-circle ml-2" aria-hidden="true" title="View Images" style="color: #164166;"
    (click)="openImagesView()"></i>


<ng-template #viewImagesPanel>
    <div class="modal-header">
        <button class="btn btn-warning modal-close-btn" mat-dialog-close>✖</button>
        <div class="col-6">
            <h5>Item Profile Image Details</h5>
        </div>

    </div>
    <div class="modal-body">

        <div class="carousel-inner">
            <div class="img-block" *ngFor="let img_ of  selectedRowData" style="border: 4px solid #80808021;
            border-radius: 12px;
            min-width: 100%;
            margin-top: 16px;
            padding: 12px;position: relative;">
                <img [src]="getImageUrl(img_)" class="d-block w-80" style="width: 99%;" />

                 <!-- <a style="color: #0061ff;
                 font-size: 2rem;
                 position: absolute;
                 right: 16px;
                 top: 16px;" *ngIf="img_['fileName'].split('.').splice(-1) == 'png'|| img_['fileName'].split('.').splice(-1) == 'jpeg' || img_['fileName'].split('.').splice(-1) == 'jpg' ||img_['fileName'].split('.').splice(-1) == 'JPG'"
                 [href]="'data:application/octet-stream;base64,' + img_['file'] | filePipe"
                 download="{{img_['fileName']}}">
                 <img class="cursor-pointer" src="/assets/images/new/download.svg" data-toggle="tooltip" [title]="'Download '+ img_['fileName']" width="30" height="30"  aria-hidden="true" title="Download Attachment" />
 </a>-->
            </div>
        </div>




    </div>
</ng-template>
