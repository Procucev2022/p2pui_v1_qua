<div class="col-12">
    <div class="row">

        <div class="col-12 page-title-pane">
            <h5>Edit Service</h5>
        </div>
        <div class="col-12 page-body-pane">
            <div class="prqContainer row">
                <div class="col-12">

                    <form class="form-horizontal" name="form" (ngSubmit)="onEditService(addForm)" #addForm="ngForm"
                        novalidate>
                        <!-- <div class="form-group row">

                            <button type="button" mat-raised-button color="warn"
                                (click)="addForm.reset()">Reset</button>

                        </div> -->
                        <div *ngIf="addForm.invalid && addForm.touched">
                            <small *ngIf="addForm.invalid && addForm.touched" class="text-danger">
                                All Marked <b style="color: red;">*</b> fields are mandatory.</small>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <label class="control-label col-sm-4" for="text">SAC Code (6 digits):<b style="color: red;">*</b></label>
                                <div class="col-sm-8">
                                    <input type="text" required class="form-control" id="sacCode" placeholder="Enter SAC Code"
                                        name="sacCode" [(ngModel)]="vendorServiceData.sacCode" #hsnCode="ngModel">

                                    <!-- <select class="form-control" id="sacCode" placeholder="Add SAC Code" name="sacCode"
                                        [(ngModel)]="model.sacCode" #hsnCode="ngModel">
                                        <option [value]="undefined" selected>Select</option>
                                        <option *ngFor="let opt of SACCodes" [value]="opt">{{opt}}</option>
                                    </select> -->
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <label class="control-label col-sm-4" for="text">Service Name:<b style="color: red;">*</b></label>
                                <div class="col-sm-8">
                                    <input type="text" required class="form-control" id="serviceName"
                                        placeholder="Add Service Name" name="serviceName"
                                        [(ngModel)]="vendorServiceData.serviceName" #serviceName="ngModel">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <label class="control-label col-sm-4" for="text">Description:<b style="color: red;">*</b></label>
                                <div class="col-sm-8">
                                    <input type="text" required class="form-control" id="description"
                                        placeholder="Add Description" name="description" [(ngModel)]="vendorServiceData.description"
                                        #description="ngModel">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <label class="control-label col-sm-4" for="text">Others:</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="others" placeholder="Add others"
                                        name="others" [(ngModel)]="vendorServiceData.others" #others="ngModel">
                                </div>
                            </div>
                        </div><br>
                        <!-- <div class="form-group">
                          <div class="col-sm-offset-2 col-sm-10">
                            <div class="checkbox">
                              <label><input type="checkbox"> Remember me</label>
                            </div>
                          </div>
                        </div> -->
                        <mat-dialog-actions align="end">
                            <button type="button" mat-raised-button color="warn"
                                (click)="addForm.reset()">Reset</button>
                            <button mat-raised-button color="primary" cdkFocusInitial type="submit">Save</button>
                            <button mat-raised-button color="warn" (click)="closeDialog()"
                                mat-dialog-close>Cancel</button>
                        </mat-dialog-actions>
                    </form>




                </div>
            </div>
        </div>
    </div>
</div>
