
<div class="col-12">
    <div class="row">

      <div class="col-12 page-title-pane">
        <h5>Edit Client Reference</h5>
      </div>
      <div class="col-12 page-body-pane">
        <div class="prqContainer row">
          <div class="col-12">

            <form class="form-horizontal" name="addVendorCliRef" (ngSubmit)="onEditClientRef(addForm)" #addForm="ngForm"
              novalidate>
              <div *ngIf="addForm.invalid && addForm.touched">
                  <small *ngIf="addForm.invalid && addForm.touched" class="text-danger">
                      All Marked <b style="color: red;">*</b> fields are mandatory.</small>
              </div>

              <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">Company Name:<b style="color: red;">*</b></label>
                  <div class="col-sm-8">
                    <input type="text" required name="name" class="form-control" [(ngModel)]="clientRefrenceDate.name"
                      id="i_name" placeholder="Name">
                  </div>
                </div>
              </div>

              <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">Email:<b style="color: red;">*</b></label>
                  <div class="col-sm-8">
                    <input type="text" required name="email" class="form-control" [(ngModel)]="clientRefrenceDate.email"
                      id="i_email" placeholder="Email">
                  </div>
                </div>
              </div>

              <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">Contact Person Name:<b style="color: red;">*</b></label>
                  <div class="col-sm-8">
                    <input type="text" required name="pocFirstName" class="form-control" [(ngModel)]="clientRefrenceDate.pocFirstName"
                      id="i_poc_first_name" placeholder="POC First Name">
                  </div>
                </div>
              </div>

              <!-- <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">POC Last Name:<b style="color: red;">*</b></label>
                  <div class="col-sm-8">
                    <input type="text" required name="pocLastName" class="form-control" [(ngModel)]="clientRefrenceDate.pocLastName"
                      #pocLastName="ngModel" id="i_poc_last_name" placeholder="POC Last Name">
                  </div>
                </div>
              </div> -->

              <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">Phone:<b style="color: red;">*</b></label>
                  <div class="col-sm-8">
                    <input type="text" required name="phone" class="form-control" [(ngModel)]="clientRefrenceDate.phone"
                      id="i_phone" placeholder="Phone">
                  </div>
                </div>
              </div>

              <div class="form-group">
                  <div class="row">
                    <label class="control-label col-sm-4" for="text">Location:<b style="color: red;">*</b></label>
                    <div class="col-sm-8">
                      <input type="text" required name="location" class="form-control" [(ngModel)]="clientRefrenceDate.location"
                        id="i_location" placeholder="Location">
                    </div>
                  </div>
                </div>

              <div class="form-group">
                <div class="row">
                  <label class="control-label col-sm-4" for="text">Comments</label>
                  <div class="col-sm-8">
                    <textarea type="text" name="comments" class="form-control" [(ngModel)]="clientRefrenceDate.comments"
                       id="i_comments" placeholder="Comments"></textarea>
                  </div>
                </div>
              </div>

              <br>
              <mat-dialog-actions align="end">
                <button type="button" mat-raised-button color="warn" (click)="addForm.reset()">Reset</button>
                <button mat-raised-button color="primary" cdkFocusInitial type="submit">Submit</button>
                <button mat-raised-button color="warn" (click)="closeDialog()" mat-dialog-close>Cancel</button>
              </mat-dialog-actions>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
