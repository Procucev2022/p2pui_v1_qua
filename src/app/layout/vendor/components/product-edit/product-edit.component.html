                    <div class="col-sm-8">

                        name="hsnCode" [(ngModel)]="vendorProductData.hsnCode" #hsnCode="ngModel">

                        </select> -->

                        </div> -->

                </div>
            </div>

            <div class="form-group">
                <div class="row">
                    <label class="control-label col-sm-4" for="text">Brand Name:</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="brandName" placeholder="Add Brand Name"
                        name="brandName" [(ngModel)]="vendorProductData.brandName" #brandName="ngModel">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="row">
                    <label class="control-label col-sm-4" for="text">Product Name:<b style="color: red;">*</b></label>
                    <div class="col-sm-8">
                        <input type="text" required class="form-control" id="productName" placeholder="Add Product Name"
                        name="productName" [(ngModel)]="vendorProductData.productName" #productName="ngModel">
                         <!-- <div *ngIf="productName.invalid && productName.touched" class="text-danger">
                          <small *ngIf="productName.errors?.required">Product Name is required.</small>

                        </div> -->
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="row">
                    <label class="control-label col-sm-4" for="text">Description:<b style="color: red;">*</b></label>
                    <div class="col-sm-8">
                        <input type="text" required class="form-control" id="description" placeholder="Add Description"
                        name="description" [(ngModel)]="vendorProductData.description" #description="ngModel">
                         <!-- <div *ngIf="description.invalid && description.touched" class="text-danger">

                        </div> -->
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="row">
                    <label class="control-label col-sm-4" for="text">Others:</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="others" placeholder="Add others"
                        name="others" [(ngModel)]="vendorProductData.others" #others="ngModel">
                    </div>
                </div>
            </div><br>

            <mat-dialog-actions align="end">
                <button type="button" mat-raised-button color="warn" (click)="addForm.reset()">Reset</button>

                <button mat-raised-button color="warn" (click)="closeDialog()" mat-dialog-close>Cancel</button>
