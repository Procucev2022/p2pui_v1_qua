<div class="modal-header">
  <button id="viewpr" name="viewpr" name="acceptpr" class="btn-skelton modal-close-btn"  mat-dialog-close>✖</button>
    <div class="col-6">
      <h5>Add Contact</h5>
  </div>
</div>
<div class="modal-body">
  <div class="col-12">
    <form class="form-horizontal" name="form" (ngSubmit)="onAddContact(addForm)" #addForm="ngForm" novalidate>
      <div *ngIf="addForm.invalid && addForm.touched">
          <small *ngIf="addForm.invalid && addForm.touched" class="text-danger">
              All Marked <b style="color: red;">*</b> fields are mandatory.</small>
      </div>

      <div class="form-group">
        <div class="row">
          <label class="control-label col-sm-4" for="text">Name:<b style="color: red;">*</b></label>
          <div class="col-sm-8">
            <input type="text" required name="firstName" class="form-control" id="i_firstName" placeholder="Name"
              [(ngModel)]="model.firstName" #firstName="ngModel">
          </div>
        </div>
      </div>

      <!-- <div class="form-group">
        <div class="row">
          <label class="control-label col-sm-4" for="text">Last Name:<b style="color: red;">*</b></label>
          <div class="col-sm-8">
            <input type="text" required name="lastName" class="form-control" id="i_)lastName" placeholder="Last Name"
              [(ngModel)]="model.lastName" #lastName="ngModel">
          </div>
        </div>
      </div> -->

      <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Designation:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="designation" class="form-control" id="i_)designation" placeholder="Designation"
                [(ngModel)]="model.designation" #designation="ngModel">
            </div>
          </div>
      </div>

      <div class="form-group">
        <div class="row">
          <label class="control-label col-sm-4" for="text">Email:<b style="color: red;">*</b></label>
          <div class="col-sm-8">
            <input type="text" required name="email" class="form-control" id="i_email" placeholder="Email"
              [(ngModel)]="model.email" #email="ngModel">
          </div>
        </div>
      </div>

      <div class="form-group">
        <div class="row">
          <label class="control-label col-sm-4" for="text">Phone:<b style="color: red;">*</b></label>
          <div class="col-sm-8">
            <input type="text" required name="phone" class="form-control" id="i_phone" placeholder="Phone"
              [(ngModel)]="model.phone" #phone="ngModel">
          </div>
        </div>
      </div>

      <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Alternative Number:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="alternativenumber" class="form-control" id="i_alternativenumber" placeholder="Alternative Number"
                [(ngModel)]="model.alternativenumber" #alternativenumber="ngModel">
            </div>
          </div>
      </div><br>

      <mat-dialog-actions align="end">
        <button type="button" class="btn btn-secondary" (click)="addForm.reset()">Reset</button>
        <button class="btn btn-primary" type="submit">Submit</button>
        <!-- <button mat-raised-button color="warn" (click)="closeDialog()" mat-dialog-close>Cancel</button> -->
      </mat-dialog-actions>
    </form>
  </div>
</div>
