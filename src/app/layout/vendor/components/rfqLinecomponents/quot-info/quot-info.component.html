<div class="col-12">

    <p-table #quotDetail [columns]="quotInfoHeaders" [value]="quotInfoList" [scrollable]="true" sortMode="multiple" [paginator]="true" [rows]="pageRecordSize"  id="quotDetail"
    [rowsPerPageOptions]="pageOptions" [style]="{width:'100%'}" exportFilename="rfq details" [(selection)]="selectedData">
    <ng-template pTemplate="caption">
      <div class="searchPanel">
        <!-- <span class="crudAddBtn">
        <button class="btn btn-primary "  *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_PR_PAGE.RFQ_CREATE) != -1" (click)="onCreateRfqs(createRfqModal)">Create RFQ</button>
        &nbsp; &nbsp;
        <button class="btn btn-primary "  *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_PR_PAGE.VENDOR_SEARCH) != -1"  (click)="vendorSearch()">Vendor Search</button>
        </span> -->
        <input type="text" pInputText size="50" placeholder="Search.."
          (input)="quotDetail.filterGlobal($event.target.value, 'contains')" style="width:auto; float: right;" />
      </div>
    </ng-template>
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th style="width: 3em">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th *ngFor="let col of columns" [pSortableColumn]="col.field" [ngStyle]="{'width': col.field == 'id'? '230px': 'auto'}"  pResizableColumn>
          {{col.header}}
          <p-sortIcon [field]="col.field"></p-sortIcon>
        </th>
        <!-- <th>Actions</th> -->
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-columns="columns" let-rowData>
      <tr [pSelectableRow]="rowData" >
        <td style="width: 3em">
          <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
        </td>
        <td *ngFor="let col of columns" [ngStyle]="{'width': col.field == 'id'? '230px': 'auto'}" class="ui-resizable-column">
          <span *ngIf="!col.isLink"> {{rowData[col.field]}}</span>
          <span *ngIf="col.isLink" class="cellLinkCls"> <a href="javascript:void(0);" (click)="getRFQs(rowData, $event)"> {{rowData[col.field]}} </a></span>

        </td>
        <!-- <td>
          <span class="crud-icons" >
           <span  (click)="viewCorresspondance(rowData)"> <img class="eye" src="assets/images/eye.png"> Comments</span>
          </span>
        </td> -->
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage" let-columns>
      <tr>
        <td [attr.colspan]="5" style="text-align:center;">
          No Records Found.
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="paginatorleft">
      <div *ngIf="quotDetail._totalRecords > 0">
        <b>Showing {{quotDetail.first+1}} to {{quotDetail.first+quotDetail.rows > quotDetail.totalRecords?quotDetail.totalRecords: quotDetail.first+quotDetail.rows}} of {{quotDetail.totalRecords}}</b>
        <!-- <app-page-info [totalRecords]="quotInfoList.length" [pageData]="paginatoryDetails"></app-page-info> -->
      </div>
    </ng-template>
  </p-table>
</div>
