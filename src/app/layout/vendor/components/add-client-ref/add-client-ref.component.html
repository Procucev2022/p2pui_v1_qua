<div class="modal-header">
  <button class="modal-close-btn"  mat-dialog-close>✖</button>
  <div class="col-12">
      <h5>Add Client Reference</h5>
  </div>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-12">

      <form class="form-horizontal" name="addVendorCliRef" (ngSubmit)="onAddClient(addForm)" #addForm="ngForm"
        novalidate>
        <div *ngIf="addForm.invalid && addForm.touched">
            <small *ngIf="addForm.invalid && addForm.touched" class="text-danger">
                All Marked <b style="color: red;">*</b> fields are mandatory.</small>
        </div>

        <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Company Name:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="name" class="form-control" [(ngModel)]="model.name"
                id="i_name" placeholder="Name">
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Email:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="email" class="form-control" [(ngModel)]="model.email"
                id="i_email" placeholder="Email">
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Contact Person Name:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="pocFirstName" class="form-control" [(ngModel)]="model.pocFirstName"
                id="i_poc_first_name" placeholder="POC First Name">
            </div>
          </div>
        </div>

        <!-- <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">POC Last Name:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="pocLastName" class="form-control" [(ngModel)]="model.pocLastName"
                #pocLastName="ngModel" id="i_poc_last_name" placeholder="POC Last Name">
            </div>
          </div>
        </div> -->

        <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Phone:<b style="color: red;">*</b></label>
            <div class="col-sm-8">
              <input type="text" required name="phone" class="form-control" [(ngModel)]="model.phone"
                id="i_phone" placeholder="Phone">
            </div>
          </div>
        </div>

        <div class="form-group">
            <div class="row">
              <label class="control-label col-sm-4" for="text">Location:<b style="color: red;">*</b></label>
              <div class="col-sm-8">
                <input type="text" required name="location" class="form-control" [(ngModel)]="model.location"
                  id="i_location" placeholder="Location">
              </div>
            </div>
          </div>

        <div class="form-group">
          <div class="row">
            <label class="control-label col-sm-4" for="text">Comments</label>
            <div class="col-sm-8">
              <textarea type="text" name="comments" class="form-control" [(ngModel)]="model.comments"
                  id="i_comments" placeholder="Comments"></textarea>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <label for="text" class="control-label col-sm-4">Remarks & Attachments</label>
            <div class="col-sm-8">
              <input type="file" multiple name="files" class="form-control" id="fileupload" [(ngModel)]="model.files"
                placeholder="Browse Your Files" (change)="onFileUpload($event.target.files)">
            </div>
          </div>
        </div>

        <br>
        <mat-dialog-actions align="end">
          <button type="button" type="button" class="btn btn-secondary" (click)="addForm.reset()">Reset</button>
          <button type="button" class="btn btn-primary" type="submit">Submit</button>
          <button type="button" class="btn btn-danger" (click)="closeDialog()" mat-dialog-close>Cancel</button>
        </mat-dialog-actions>
      </form>
    </div>
  </div>
</div>
