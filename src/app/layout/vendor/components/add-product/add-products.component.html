<div class="modal-header">
    <button class="modal-close-btn" mat-dialog-close>✖</button>
    <div class="col-12">
        <h5>Add Product</h5>
    </div>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-12">
            <form class="form-horizontal" name="form" (ngSubmit)="onAddProduct(addForm)" #addForm="ngForm" novalidate>
                <div class="form-group">
                    <div *ngIf="addForm.invalid && addForm.touched">
                        <small *ngIf="addForm.invalid && addForm.touched" class="text-danger">
                            All Marked <b style="color: red;">*</b> fields are mandatory.</small>
                    </div>
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">HSN Code (First 4 digits):<b
                                style="color: red;">*</b></label>
                        <div class="col-sm-8">
                            <input type="number" required  class="form-control" id="hsnCode" placeholder="Add HSN Code"
                                name="hsnCode" [(ngModel)]="model.hsnCode" #hsnCode="ngModel" >
                            <div *ngIf="(addForm.controls.hsnCode.touched|| addForm.submitted) && addForm.controls.hsnCode.status=='INVALID'">
                                <div style="color: red;">HSN Code is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">Brand Name:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="brandName" placeholder="Add Brand Name"
                                name="brandName" [(ngModel)]="model.brandName" #brandName="ngModel">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">Product Name:<b
                                style="color: red;">*</b></label>
                        <div class="col-sm-8">
                            <input type="text" required class="form-control" id="productName"
                                placeholder="Add Product Name" name="productName" [(ngModel)]="model.productName"
                                #productName="ngModel">
                            <div *ngIf="(addForm.controls.productName.touched|| addForm.submitted)&& addForm.controls.productName.status=='INVALID'">
                                <div style="color: red;">Product Name is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">Description:<b
                                style="color: red;">*</b></label>
                        <div class="col-sm-8">
                            <input type="text" required class="form-control" id="description"
                                placeholder="Add Description" name="description" [(ngModel)]="model.description"
                                #description="ngModel">
                            <div *ngIf="(addForm.controls.description.touched|| addForm.submitted) && addForm.controls.description.status=='INVALID'">
                                <div style="color: red;">Description is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">Others:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="others" placeholder="Add others" name="others"
                                [(ngModel)]="model.others" #others="ngModel">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <label class="control-label col-sm-4" for="text">Upload Image:<b
                                style="color: red;">*</b></label>
                        <div class="col-sm-8">
                            <input #Image type="file" required class="form-control"
                                (change)="handleFileInput($event.target.files)" />
                            <div *ngIf=" addForm.submitted && !imageUrl">
                                <div style="color: red;">Image is required</div>
                            </div>
                        </div>
                    </div>
                </div>
                <br>
                <mat-dialog-actions align="end">
                    <button type="button" class="btn btn-secondary" (click)="addForm.reset()">Reset</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-danger" (click)="closeDialog()"
                        mat-dialog-close>Cancel</button>
                </mat-dialog-actions>
            </form>
        </div>
    </div>
</div>
