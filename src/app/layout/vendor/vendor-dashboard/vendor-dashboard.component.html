<div class="vendor-dashboard-root">

  <!-- ── Vendor workspace screen cards navigation ── -->
  <div class="workspace-nav-section mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
      <div class="d-flex align-items-center">
        <span class="section-tag-badge">
          <i class="fa fa-truck mr-1"></i> Vendor Operations Workspace
        </span>
        <span class="text-xs text-muted d-none d-md-inline ml-2">&middot; 6 Integrated Supplier Screens</span>
      </div>

      <div *ngIf="activeTab === 'quotation'">
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="setTab('opportunity-feed')">
          <i class="fa fa-arrow-left mr-1"></i> Back to Opportunity Feed
        </button>
      </div>
    </div>

    <div class="row screens-cards-grid">
      <div *ngFor="let screen of screens" class="col-xl-2 col-lg-4 col-md-4 col-sm-6 mb-3">
        <div class="screen-nav-card h-100 p-3 position-relative"
             role="button"
             tabindex="0"
             [ngClass]="[screen.colorClass, activeTab === screen.id ? 'card-active' : 'card-inactive']"
             (click)="setTab(screen.id)"
             (keydown.enter)="setTab(screen.id)"
             (keydown.space)="setTab(screen.id)">
          <div class="card-top-accent"></div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="screen-num-pill mono">{{ screen.screenNum }}</span>
            <span *ngIf="activeTab === screen.id" class="active-pulse-indicator">
              <span class="pulse-ring"></span>
              <span class="pulse-dot"></span>
            </span>
          </div>

          <div class="d-flex align-items-center mb-1">
            <div class="screen-icon-box">
              <i class="{{ screen.icon }} fa-lg"></i>
            </div>
            <div class="screen-text-content overflow-hidden ml-2">
              <h6 class="screen-card-title mb-0 text-truncate">{{ screen.title }}</h6>
              <span class="screen-card-subtitle text-muted text-truncate d-block">{{ screen.subtitle }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Screen content ── -->
  <div class="screen-view-container">
    <app-vendor-opportunity-feed
      *ngIf="activeTab === 'opportunity-feed'"
      [profile]="profile"
      (navigateToBidForm)="openBidForm($event)"
      (navigateToSubscriptions)="goToSubscriptions()"
    ></app-vendor-opportunity-feed>

    <app-vendor-quotations
      *ngIf="activeTab === 'quotation'"
      [opportunity]="selectedOpportunity"
      (back)="setTab('opportunity-feed')"
      (submitted)="onQuotationSubmitted()"
    ></app-vendor-quotations>

    <app-vendor-qualification
      *ngIf="activeTab === 'qualification'"
      [profile]="profile"
      (back)="setTab('opportunity-feed')"
    ></app-vendor-qualification>

    <app-vendor-item-catalogue
      *ngIf="activeTab === 'catalogue'"
      [profile]="profile"
      (navigateToSubscriptions)="goToSubscriptions()"
    ></app-vendor-item-catalogue>

    <app-vendor-subscription-center
      *ngIf="activeTab === 'subscriptions'"
      [profile]="profile"
    ></app-vendor-subscription-center>

    <app-vendor-profile-detail
      *ngIf="activeTab === 'profile'"
      [profile]="profile"
    ></app-vendor-profile-detail>
  </div>
</div>
