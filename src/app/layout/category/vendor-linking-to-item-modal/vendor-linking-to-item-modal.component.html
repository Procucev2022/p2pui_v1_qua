<div class="modal-header">
    <button class="btn btn-warning modal-close-btn" mat-dialog-close>✖</button>
    <div class="col-6">Link Items - Vendor</div>
</div>
<div class="modal-body">
    <form class="row " [formGroup]="searchForm">
        <div class="col-12 row" style="margin-bottom: 15px;">
            <div class="col-5 text-right">
                <label>Type</label>
            </div>
            <div class="col-7">
                <mat-radio-group formControlName="type">
                    <mat-radio-button class="example-margin" [value]="'hsn'">Product </mat-radio-button>
                    <mat-radio-button class="example-margin" [value]="'sac'">Service</mat-radio-button>
                </mat-radio-group>
            </div>
        </div>
        <div class="col-12 ">
            <div class="row row pb-2">
                <div class="col-3">
                    <label>Orgnization Name</label>
                    <input formControlName="companyName" class="form-control" placeholder="Enter Organization Name" />
                </div>
                <div class="col-3">
                    <label>City</label>
                    <input formControlName="city" class="form-control" placeholder="Enter City/Location" />
                </div>
                <div class="col-3" *ngIf="type.value == 'hsn'">
                    <label>HSN Code</label>
                    <input formControlName="hsncode" class="form-control" placeholder="Enter HSN Code" />
                </div>
                <div class="col-3" *ngIf="type.value == 'sac'">
                    <label>SAC Code</label>
                    <input formControlName="saccode" class="form-control" placeholder="Enter SAC Code" />
                </div>
                <div class="col-3 dc">
                    <button class="btn btn-danger btn-red" (click)="searchVendor()" type="button" (click)="resetForm()"> Reset</button>
                    <button class="btn btn-primary btn-blue" [disabled]="(!city.value && !companyName.value && !hsncode.value && !saccode.value)" (click)="searchVendor()" type="submit"><i class="fa fa-search" aria-hidden="true"></i> Search</button>
                </div>
            </div>
        </div>
    </form>
    <div class="row">
        <div class="col-12">
            <p-table #vDt [columns]="vendorHeaders" [value]="vendorList" sortMode="multiple" [paginator]="true" [rows]="vendorList.length" id="quoteTable" [style]="{'width': '100%'}" [paginator]="true" [rows]="pageRecordSize" id="quoteTable" exportFilename="venRequest"
                [(selection)]="selectedData" [scrollable]="true">
                <ng-template pTemplate="caption">
                    <div class="table-search">
                      <div class="row">
                        <div class="col-sm-6">
                          <input class="main-input" type="text" pInputText size="50" placeholder="Search.."
                            (input)="vDt.filterGlobal($event.target.value, 'contains')" />
                        </div>
                        <div class="col-sm-6">
                        </div>
                      </div>
                    </div>
                </ng-template>
                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th style="width: 3em">
                            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                        </th>
                        <th *ngFor="let col of columns" [pSortableColumn]="col.field" [style.width]="col.width"> {{col.header}}
                            <p-sortIcon [field]="col.field"></p-sortIcon>
                        </th>
                        <th style="width: 25em">Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowData let-columns="columns" let-index="rowIndex">
                    <tr [pSelectableRow]="rowData">
                        <td style="width: 3em">
                            <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                        </td>
                        <td *ngFor="let col of columns" [style.width]="col.width">
                            <span *ngIf="col.field == 'companyName'">{{rowData[col.field]}}<img *ngIf="rowData['status'] == 'Completed'" width="18" src="https://img.icons8.com/color/48/000000/instagram-verification-badge.png"/></span>
                            <span *ngIf="col.field != 'companyName'">{{rowData[col.field]}}</span>
                        </td>
                        <td style="width: 25em">
                            <span class="crud-icons actionIcons">
                                <!-- <span *ngIf="rowData['isEdit']" >
                                    <span class="linkedCls" style="color:green; padding-right: 10px;"  (click)="linkUnLinkVendor(rowData, index, isLinked =true, isEdit = false)"> <i class="fa fa-check" aria-hidden="true"></i>Save</span>
                            <span class="linkedCls" style="color:rgb(153, 53, 14)" (click)="resetRowData(rowData, index)"><i class="fa fa-times" aria-hidden="true"></i>Discard</span>
                            </span> -->
                            <span class="linkedCls" *ngIf="!rowData['isLinked'] && !rowData['isEdit']" (click)="linkUnLinkVendorModal(rowData, index)"> <i class="fa fa-link" aria-hidden="true"></i> Link Now</span>

                            <span class="unLinkedCls" *ngIf="rowData['isLinked']">
                                    <span style="color:green; padding-right: 10px;cursor: default"> Linked
                                    </span>
                            <span class="linkedCls" *ngIf="rowData['isEdit']" (click)="linkUnLinkVendorModal(rowData, index)"> <i class="fa fa-pencil" aria-hidden="true"></i> Edit</span>
                            <span class="linkedCls" style="color:rgb(153, 53, 14); padding-right: 10px;" (click)="unLinkVendor(rowData, index, true)"> <i class="fa fa-chain-broken" aria-hidden="true"></i>UnLink</span>
                            </span>
                            </span>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage" let-columns>
                    <tr>
                        <td [attr.colspan]="5" style="text-align:center;">
                            No Records Found.
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="paginatorleft">
                    <div *ngIf="vDt._totalRecords > 0">
                        <b>Showing {{vDt.first+1}} to {{vDt.first+vDt.rows > vDt.totalRecords?vDt.totalRecords: vDt.first+vDt.rows}} of {{vDt.totalRecords}}</b>
                        <!-- <app-page-info [totalRecords]="vendorList?.length" [pageData]="paginatoryDetails"></app-page-info> -->
                    </div>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<div class="modal-footer">
    <mat-dialog-actions align="end">
        <button class="btn btn-danger btn-red" type="button"  type="button" mat-dialog-close>close</button>
        <button class="btn btn-primary btn-green" [disabled]="!checkAnyVendorLinkedOrNot()" type="submit" *ngIf="vendorList.length>0" (click)="submitForm()">Link Now</button>
    </mat-dialog-actions>
</div>
