<div class="modal-header">
    <button class="btn btn-warning modal-close-btn" mat-dialog-close>✖</button>
    <div class="col-6">
        <h5>Issue Details</h5>
    </div>
</div>
<div class="modal-body">
    <div class="col-12 page-body-pane">
        <div class="prqContainer row">
            <div class="col-12">
                <form #viewIssue="ngForm">
                    <div class="form-group">
                        <label for="priority" style="font-size: medium; font-weight: bolder;" class="form-label">Client
                            Id </label>

                        <input type="text" class="form-control" disabled [ngModel]="data.clientId.companyName"
                            name="clientId" id="i_clientId">
                        <!-- <small class="detailsCls" *ngIf="clientId != undefined"> {{'Selected Vendor Id:' + clientId}}</small> -->

                    </div>

                    <div class="form-group">
                        <label for="priority" style="font-size: medium; font-weight: bolder;" class="form-label">Vendor
                            Id </label>

                        <input type="text" class="form-control" disabled [ngModel]="data.vendorId.companyName"
                            name="vendorId" id="i_vendorId">

                        <!-- <small class="detailsCls" *ngIf="vendorId != undefined"> {{'Selected Vendor Id:' + vendorId}}</small> -->

                    </div>

                    <div class="form-group">
                        <label for="vDoc" style="font-size: medium; font-weight: bolder;" class="form-label">Vendor
                            Documents</label>
                        <div class="row col-md-12">
                            <div class="col-md-4" *ngFor="let doc of vendorProDoc" style="margin: 6px 0px;">
                                <div class="crud-icons actionIcons multiDoc" style="display: inline;">
                                    <a [href]="'data:application/octet-stream;base64,' + doc['file'] | filePipe"
                                        download="{{doc['fileName']}}"><i class="fa fa-download" aria-hidden="true"
                                            data-toggle="tooltip" [title]="'Download '+ doc['fileName']"><span
                                                class="singleDoc">{{doc.fileName}}</span></i></a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description" style="font-size: medium; font-weight: bolder;"
                            class="form-label">Issue Description </label>

                        <textarea disabled name="questions" id="i_decription" [(ngModel)]="data.questions"
                            class="form-control">
                            </textarea>

                    </div>

                    <div class="queAnsCls" *ngFor="let comment of commentsList">
                        <div class="title">
                            <div class="createdBy">
                                <div class="key">Commented By : <span class="commentedByCls">
                                        {{comment['answersBy']}}</span></div>
                            </div>
                        </div>
                        <div class="content">
                            <div class="key">Message :</div>
                            <p>{{comment.answer}}</p>
                        </div>
                    </div>

                    <div class="alert alert-warning marginTop10 " *ngIf="commentsList?.length == 0">
                        <h5>No Comments Available.</h5>
                    </div>

                    <div>
                        <textarea name="newComment" placeholder="Enter your message" [(ngModel)]="newComment"
                            class="form-control"></textarea>
                        <button class="btn btn-success btn-green mt-3" style="float: right;" (click)="addNewComment()"
                            type="button">Send</button>
                        <button class="btn btn-danger btn-red mt-3" style="float: right;" (click)="closeDialog()" type="button"
                            mat-dialog-close>Close</button>
                    </div>

                    <!-- <div style="margin-top: 50px;">
                            <mat-dialog-actions align="end">
                                <button mat-raised-button color="warn" (click)="closeDialog()"
                                    mat-dialog-close>Close</button>
                            </mat-dialog-actions>
                        </div> -->

                </form>
            </div>
        </div>
    </div>
</div>
