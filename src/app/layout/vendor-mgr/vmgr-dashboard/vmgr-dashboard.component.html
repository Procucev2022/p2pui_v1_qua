<div class="col-12 pad-nill">
  <div class="table-title">
    <div class="row">
      <div class="col-sm-6">
        <h2>Dashboard</h2>
      </div>
      <div class="col-sm-6">
      </div>
    </div>
  </div>
  <div class="col-12 general">
    <mat-tab-group mat-stretch-tabs (selectedTabChange)="onTabClick($event)">
      <mat-tab
        *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_VENDOR_DASHBOARD_PAGE.VENDORS_TAB_VIEW) != -1"
        label="Registered Vendors" class="mat-tabs">
        <app-vendortab></app-vendortab>
      </mat-tab>
      <mat-tab
        *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_VENDOR_DASHBOARD_PAGE.APPROVE_PENDING_TAB_VIEW) != -1"
        label="Approval Pending" class="mat-tabs">
        <app-approvalpending-tab></app-approvalpending-tab>
      </mat-tab>
      <mat-tab
        *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_VENDOR_DASHBOARD_PAGE.REG_PENDING_VIEW) != -1"
        label="Registration Pending" class="mat-tabs">
        <vendor-reg-pending></vendor-reg-pending>
      </mat-tab>
      <mat-tab
        *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_VENDOR_DASHBOARD_PAGE.REG_PENDING_VIEW) != -1"
        label="Rejected" class="mat-tabs">
        <app-vendor-rejected></app-vendor-rejected>
      </mat-tab>
      <mat-tab
        *ngIf="loggedUserPermissions?.indexOf(defaultPermissions.PC_VENDOR_DASHBOARD_PAGE.REG_PENDING_VIEW) != -1"
        label="Forward Vendors" class="mat-tabs">
        <app-forwarded-vendors-tab></app-forwarded-vendors-tab>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
