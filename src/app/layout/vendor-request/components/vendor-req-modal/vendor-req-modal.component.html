<div class="modal-header">
    <button class="btn btn-warning modal-close-btn"  mat-dialog-close>✖</button>
      <div class="col-6">
            <h5>Vendor Classification</h5>
        </div>
</div>
<div class="modal-body">
        <div class="col-12 page-body-pane">
            <div class="prqContainer row">
                <div class="col-12">
                    <form #approvalForm="ngForm" (ngSubmit)="onSubmit(approvalForm,selectedProductor_Service)">
                        <div>

                            <div>
                                <section *ngFor="let approval of approvalList; let i = index;">
                                    <div class="form-group">
                                        <label for="priority" style="font-size: medium; font-weight: bolder;"
                                            class="form-label">Priority *</label>

                                        <select
                                            name="selectedPriority_{{i}}" id="selectedPriority_{{i}}" required
                                            #priorityType="ngModel"
                                            [(ngModel)]="selectedPriority" class="form-control">
                                            <option selected disabled [ngValue]="null">Select
                                            </option>
                                            <option *ngFor="let priority of priorityTypes"
                                                [value]="priority">{{priority}}</option>
                                        </select>

                                        <small class="priorityCls">Note: High = 1 Day, Medium = 3 Days, Low = 5 Days </small>
                                        <small *ngIf="priorityType.errors?.required && priorityType.touched" class="text-danger">Priority
                                            is required</small>
                                    </div>


                                    <div class="form-group">
                                        <label for="description" style="font-size: medium; font-weight: bolder;"
                                            class="form-label">Description </label>

                                        <textarea
                                            name="description_{{i}}" id="description_{{i}}"
                                            #descriptionRef="ngModel"
                                            [(ngModel)]="description" class="form-control">

                                        </textarea>
                                    </div>


                                    <div class="form-group">
                                        <label for="priority" style="font-size: medium; font-weight: bolder;"
                                            class="form-label">Select your Product/Service *</label>

                                        <select
                                            (change)="selectChangeHandler($event, i, classificationList[i].typeName)"
                                            name="ProductorService_{{i}}" id="ProductorService_{{i}}" required
                                            #ProductOrService="ngModel"
                                            [(ngModel)]="classificationList[i].typeName" class="form-control">
                                            <option selected disabled [ngValue]="null">Select Product/Service
                                            </option>
                                            <option *ngFor="let selectedvalue of selectProductorService"
                                                [value]="selectedvalue">{{selectedvalue}}</option>
                                        </select>
                                        <small *ngIf="ProductOrService.errors?.required && ProductOrService.touched" class="text-danger">Select Product/Service
                                            is required</small>
                                    </div>
                                    <!-- <div class="row">
                                        <div class="col-md-12">
                                            <div class="" style="float: right;">
                                                <button type="button" *ngIf="i == approvalList.length-1"
                                                    class="btn btn-success"
                                                    (click)="add(i, classificationList[i].typeName)">+</button>
                                            </div>
                                        </div>
                                        <div class="col-md-12" *ngIf="i < approvalList.length -1">
                                            <div class="" style="float: right;">
                                                <button type="button" class="btn btn-danger"
                                                    (click)="remove(i)">✖</button>
                                            </div>
                                        </div>


                                    </div> -->
                                    <div class="row" *ngIf="classificationList[i].typeName == 'Product'">
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium; font-weight: bolder;">Segment *</label>


                                                <ngx-select-dropdown name="segmentName_{{i}}" #segment
                                                    id="category_segment_{{i}}" required
                                                    (change)="onSegmentChange($event.value,i,family,class,commodity)" [multiple]="false"
                                                    [(ngModel)]="classificationList[i].segmentName"
                                                    [config]="dropDownConfig" [options]="approval.segmentNames">
                                                </ngx-select-dropdown>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Family *
                                                    </label>

                                                <ngx-select-dropdown name="familyName_{{i}}" id="familyName_{{i}}" #family required
                                                    (change)="onFamilyChange($event.value, classificationList[i].segmentName,i,class,commodity)"
                                                    [multiple]="false" [(ngModel)]="classificationList[i].familyName"
                                                    [config]="dropDownConfig" [options]="approval.familyNames"
                                                    [disabled]="approval.familyNames.length == 0"></ngx-select-dropdown>

                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Class *</label>

                                                <ngx-select-dropdown name="className_{{i}}" id="className_{{i}}" #class required
                                                    (change)="onClassChange($event.value, classificationList[i].segmentName, classificationList[i].familyName,i,commodity)"
                                                    [multiple]="false" [(ngModel)]="classificationList[i].className"
                                                    [config]="dropDownConfig" [options]="approval.classNames"
                                                    [disabled]="approval.classNames.length == 0"></ngx-select-dropdown>


                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Commodity *</label>

                                                <ngx-select-dropdown name="commodityName_{{i}}" id="commodityName_{{i}}" #commodity required
                                                    [multiple]="false"
                                                    (change)="onCommodityChange($event.value, classificationList[i].segmentName, classificationList[i].familyName, classificationList[i].className ,i)"
                                                    [(ngModel)]="classificationList[i].commodityName"
                                                    [config]="dropDownConfig" [options]="approval.commodityNames"
                                                    [disabled]="approval.commodityNames.length == 0">
                                                </ngx-select-dropdown>


                                            </div>
                                        </div>
                                    </div>

                                    <div class="row" *ngIf="classificationList[i].typeName == 'Service'">
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium; font-weight: bolder;">Section *</label>

                                                <ngx-select-dropdown name="categoryService_section_{{i}}" #section required
                                                    id="categoryService_section_{{i}}"
                                                    (change)="onSectionChange($event.value,i,heading,group,sac)" [multiple]="false"
                                                    [(ngModel)]="classificationList[i].section"
                                                    [config]="dropDownConfig" [options]="approval.sections">
                                                </ngx-select-dropdown>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Heading *</label>
                                                <ngx-select-dropdown name="heading_{{i}}" id="headings_{{i}}" #heading required
                                                    (change)="onHeadingChange($event.value, classificationList[i].section,i,group,sac)"
                                                    [multiple]="false" [(ngModel)]="classificationList[i].heading"
                                                    [config]="dropDownConfig" [options]="approval.headings"
                                                    [disabled]="approval.headings.length == 0"></ngx-select-dropdown>

                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Group
                                                    Description *</label>

                                                <ngx-select-dropdown name="groupdescription_{{i}}" #group required
                                                    id="groupdescription_{{i}}"
                                                    (change)="onGroupDescriptionChange($event.value, classificationList[i].section, classificationList[i].heading,i,sac)"
                                                    [multiple]="false"
                                                    [(ngModel)]="classificationList[i].groupdescription"
                                                    [config]="dropDownConfig" [options]="approval.groupdescriptions"
                                                    [disabled]="approval.groupdescriptions.length == 0">
                                                </ngx-select-dropdown>


                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-group">
                                                <label class="control-label"
                                                    style="font-size: medium;font-weight: bolder;">Sac *</label>

                                                <ngx-select-dropdown name="sac_{{i}}" id="sacs_{{i}}" [multiple]="false" #sac required
                                                    (change)="onSacChange($event.value, classificationList[i].section, classificationList[i].heading,classificationList[i].groupdescription,i)"
                                                    [(ngModel)]="classificationList[i].sac" [config]="dropDownConfig"
                                                    [options]="approval.sacs" [disabled]="approval.sacs.length == 0">
                                                </ngx-select-dropdown>


                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group" *ngIf = "loggedUserDetails.role.roleName == 'CategoryManager'">
                                        <div style="width: auto !important;" class="branchesForm col-md-12 col-pad form-group row">
                                            <div class="col-md-6">
                                                <div>
                                                    <label for="text" style="background: #ced1d4;color: #00427a;padding: 6px;"
                                                        class="col-form-label">Upload Documents:</label>

                                                    <div class="uploadfilecontainer" style="margin: 0px 0px;border-radius: 0px;"
                                                        (click)="certificatesInput.click()" fileDragDrop
                                                        (onFileDropped)="uploadFile($event)">
                                                        <input multiple hidden type="file" #certificatesInput
                                                            (change)="uploadCertificates($event.target.files)">
                                                        <div class="browseFiles">Browse Files</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div>
                                                    <label for="text" style="background: #ced1d4;color: #00427a;padding: 6px;"
                                                        class="col-form-label">Uploaded Documents:</label>
                                                    <div style="border: 1px solid lightgray;height: 200px;overflow: auto;">
                                                        <div class="files-list"
                                                            *ngFor="let file of certificatesArray;let i=index">
                                                            <p style="margin-bottom: 0px;">{{ file?.name }}</p>
                                                            <button class="delete-file"
                                                                (click)="deleteAttachment(i,'certificatesArray')">
                                                                <i class="fa fa-trash" aria-hidden="true"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </section>
                            </div>
                        </div>


                        <mat-dialog-actions align="end">


                            <button type="button"  color="warn" class="btn btn-secondary btn-red" (click)="resetPanel(approvalForm)">Reset</button>
                            <button color="primary"class="btn btn-secondary btn-green" cdkFocusInitial type="submit">Submit</button>
                            <button color="warn" class="btn btn-secondary btn-orange" (click)="closeDialog()"
                                mat-dialog-close>Cancel</button>
                        </mat-dialog-actions>

                    </form>
                </div>
            </div>
        </div>
    </div>
