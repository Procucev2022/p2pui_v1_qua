  <h4 class="card-name chart-head">{{"PR-PPO"}}</h4>
</div>
<div class="col-md-12 row">
  <div class="col-md-3 chart">
    <div class="chart-specs">
      <div class="color-wrapper">
          <div *ngFor="let item of chartBackgroundList">
              <div class="color-ref" [ngStyle]="{background: item}"></div>
          </div>
      </div>
      <div class="label-ref">
          <div *ngFor="let item of prPpoHeaders">
              {{ item }}
          </div>
      </div>
      <div class="percent">
          <div *ngFor="let item of prPpoList">
              {{item}}
          </div>
      </div>
  </div>
  </div>
  <div class="col-md-6">
    <div class="card-section sec-space">
      <div class="card-body">

        <div class="col-md-12">
            <div class="card-body" style="padding: 0px;">
              <!-- <h4 class="card-name">{{"Total Auctions"}}</h4> -->
              <div class="row" style="align-items: end;">
                <div class="col-md-4">
                  <label for="auctionFromdate">From Date</label>
                  <p-calendar [(ngModel)]="auctionFromDate" placeholder="DD-MM-YYYY" dateFormat="dd-mm-yy" showIcon="true"></p-calendar>
                </div>
                <div class="col-md-4">
                  <label for="auctionTodate">To Date</label>
                  <p-calendar [(ngModel)]="auctionToDate" placeholder="DD-MM-YYYY" dateFormat="dd-mm-yy" showIcon="true"></p-calendar>
                </div>
                <button type="button" class="btn btn-primary btn-blue" (click)="onSubmit('Auctions')">Submit</button>
              </div>
            </div>
          </div>
        <div class="chart-panel col-md-12 m-3 p-5">
          <canvas id="pramountcanvas"  height="180"> </canvas>
        </div>
        <!-- <canvas id="pramountcanvas" height="180">{{ chart }}</canvas> -->
      </div>
    </div>
