<div class="col-12 row pad-nill spec-header mrg-nill">
  <h4 class="card-name chart-head">{{"Total PR's"}}</h4>
</div>
<div class="col-md-12 row ">
  <div class="col-md-4 chart">
    <div class="chart-specs">
      <div class="color-wrapper">
          <div *ngFor="let item of chartBackgroundList">
              <div class="color-ref" [ngStyle]="{background: item}"></div>
          </div>
      </div>
      <div class="label-ref">
          <div *ngFor="let item of prHeaders">
              {{ item }}
          </div>
      </div>
      <div class="percent">
          <div *ngFor="let item of prList">
              {{item}}
          </div>
      </div>
  </div>
  </div>
  <div class="col-md-7">
    <div class="card-section sec-space">
      <div class="card-body">
        <div class="col-md-12">
          <div class="card-body" style="padding: 0px;">
            <!-- <h4 class="card-name">{{"Total Auctions"}}</h4> -->
            <div class="row" style="align-items: end;">
              <div class="col-md-4">
                <label for="prfdate">From Date</label>
                <!-- <input type="date" required #prfdate="ngModel" name="prfDate" [(ngModel)]="prfDate" id="i_prfdate"
                class="form-control" placeholder="DD-MM-YYYY"> -->
                <p-calendar [(ngModel)]="prfDate" placeholder="DD-MM-YYYY" dateFormat="dd-mm-yy" showIcon="true"></p-calendar>
              </div>
              <div class="col-md-4">
                <label for="prtdate">To Date</label>
                <p-calendar [(ngModel)]="prtDate" placeholder="DD-MM-YYYY" dateFormat="dd-mm-yy" showIcon="true"></p-calendar>
              </div>
              <button type="button" class="btn btn-primary btn-blue" (click)="onSubmit('PR')">Submit</button>
            </div>
          </div>
        </div>
        <div class="chart-panel col-md-12 m-3 p-5">
          <canvas id="prcanvas"  height="150"></canvas>
        </div>

      </div>
    </div>
  </div>
