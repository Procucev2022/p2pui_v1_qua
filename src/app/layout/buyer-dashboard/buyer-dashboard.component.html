<div class="buyer-dashboard-wrapper">

  <!-- ======================================================== -->
  <!-- SCREENS SUB-NAVIGATION BAR                               -->
  <!-- ======================================================== -->
  <nav class="screens-nav-bar" id="buyer-screens-nav">
    <div class="screens-label">SCREENS:</div>
    <div class="screens-pills-container">
      <a 
        *ngFor="let s of screenTabs"
        class="screen-pill-btn"
        [class.active]="s.active"
        [routerLink]="s.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onSelectScreen(s)"
        [attr.id]="'screen-tab-' + s.id"
      >
        <i [class]="s.icon + ' screen-icon'"></i>
        <span>{{ s.name }}</span>
      </a>
    </div>
  </nav>

  <!-- ======================================================== -->
  <!-- DYNAMIC SCREEN CONTENT (Screen 1.1 / 1.2 / 1.3)          -->
  <!-- ======================================================== -->
  <main class="screen-content-area">
    <router-outlet></router-outlet>
  </main>

</div>
