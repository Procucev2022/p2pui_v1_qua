    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                BRANCHES
            </mat-panel-title>
        </mat-expansion-panel-header>
        <p-table #branchTable [columns]="branchHeaders" [value]="vendorRegData?.orgBranches" sortMode="multiple"
            [paginator]="true" [rows]="pageRecordSize" id="branchTable" [rowsPerPageOptions]="pageOptions"
            [style]="{'width': '100%'}" exportFilename="products" [(selection)]="selectedData" [scrollable]="true">
            <ng-template pTemplate="caption">
                <div class="table-search">
                  <div class="row">
                    <div class="col-sm-6">
                        <input class="main-input" type="text" pInputText size="50" placeholder="Search.."
                        (input)="branchTable.filterGlobal($event.target.value, 'contains')"/>
                    </div>
                    <div class="col-sm-6">
                    </div>
                  </div>
                </div>
              </ng-template>
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th [style.width]="col.width" *ngFor="let col of columns" [pSortableColumn]="col.field">
                        {{col.header}}
                        <p-sortIcon [field]="col.field"></p-sortIcon>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-columns="columns">
                <tr [pSelectableRow]="rowData">
                    <td [style.width]="col.width" *ngFor="let col of columns">
                        <span *ngIf="!col.isLink"> {{rowData[col.field]}}</span>
                        <span *ngIf="col.isLink" class="cellLinkCls"> <a href="javascript:void(0);">
                                {{rowData[col.field]}} </a></span>

                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage" let-columns>
                <tr>
                    <td [attr.colspan]="5" style="text-align:center;">
                        No Records Found.
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="paginatorleft">
                <div  *ngIf="branchTable._totalRecords > 0">
                    <b>Showing {{branchTable.first+1}} to {{branchTable.first+branchTable.rows > branchTable.totalRecords?branchTable.totalRecords: branchTable.first+branchTable.rows}} of {{branchTable.totalRecords}}</b>
                </div>
            </ng-template>
        </p-table>
    </mat-expansion-panel>

    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                PRODUCTS
            </mat-panel-title>
        </mat-expansion-panel-header>
        <p-table #productsTable [columns]="productsHeaders" [value]="vendorRegData?.vendorProduct" sortMode="multiple"
            [paginator]="true" [rows]="pageRecordSize" id="productsTable" [rowsPerPageOptions]="pageOptions"
            [style]="{'width': '100%'}" exportFilename="products" [(selection)]="selectedData" [scrollable]="true">
            <ng-template pTemplate="caption">
                <div class="table-search">
                  <div class="row">
                    <div class="col-sm-6">
                        <input class="main-input" type="text" pInputText size="50" placeholder="Search.."
                        (input)="productsTable.filterGlobal($event.target.value, 'contains')"/>
                    </div>
                    <div class="col-sm-6">
                    </div>
                  </div>
                </div>
              </ng-template>
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns" [pSortableColumn]="col.field">
                        {{col.header}}
                        <p-sortIcon [field]="col.field"></p-sortIcon>
                    </th>

                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-columns="columns">
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        <span *ngIf="!col.isLink"> {{rowData[col.field]}}</span>
                        <span *ngIf="col.isLink" class="cellLinkCls"> <a href="javascript:void(0);"
                                (click)="getRFQs(rowData)">
                                {{rowData[col.field]}} </a></span>
                        <span class="crud-icons actionIcons"
                            *ngIf="rowData['fileName'] && rowData['file'] && col.fieldType">
                            <a [href]="'data:application/octet-stream;base64,' + rowData['file'] | filePipe"
                                download="{{rowData['fileName']}}"><i class="fa fa-download" aria-hidden="true"
                                    data-toggle="tooltip" [title]="'Download '+ rowData['fileName']"></i></a>
                        </span>

                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage" let-columns>
                <tr>
                    <td [attr.colspan]="5" style="text-align:center;">
                        No Records Found.
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="paginatorleft">
                <div  *ngIf="productsTable._totalRecords > 0">
                    <b>Showing {{productsTable.first+1}} to {{productsTable.first+productsTable.rows > productsTable.totalRecords?productsTable.totalRecords: productsTable.first+productsTable.rows}} of {{productsTable.totalRecords}}</b>

    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                CLIENT REFERENCES
            </mat-panel-title>
        </mat-expansion-panel-header>
        <p-table #clientReferencesTable [columns]="clientRefHeaders" [value]="vendorRegData?.clientReference"
            sortMode="multiple" [paginator]="true" [rows]="pageRecordSize" id="clientReferences"
            [rowsPerPageOptions]="pageOptions" [style]="{'width': '100%'}" exportFilename="clientReferences"
            [(selection)]="selectedData" [scrollable]="true">
            <ng-template pTemplate="caption">
                <div class="table-search">
                  <div class="row">
                    <div class="col-sm-6">
                        <input class="main-input" type="text" pInputText size="50" placeholder="Search.."
                        (input)="clientReferencesTable.filterGlobal($event.target.value, 'contains')"/>
                    </div>
                    <div class="col-sm-6">
                    </div>
                  </div>
                </div>
              </ng-template>
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th [style.width]="col.width" *ngFor="let col of columns" [pSortableColumn]="col.field">
                        {{col.header}}
                        <p-sortIcon [field]="col.field"></p-sortIcon>
                    </th>

                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-columns="columns">
                <tr [pSelectableRow]="rowData">
                    <td [style.width]="col.width" *ngFor="let col of columns">
                        <span *ngIf="!col.isLink"> {{rowData[col.field]}}</span>
                        <span *ngIf="col.isLink && col.field == 'files'" class="cellLinkCls">
                            <a *ngFor="let file of rowData[col.field]">
                                <p *ngIf="file['fileName']" style="margin-bottom: 0px;">

                                    <a *ngIf="file['fileName'].split('.').splice(-1) == 'xlsx' || file['fileName'].split('.').splice(-1) == 'xls' || file['fileName'].split('.').splice(-1) == 'csv'"
                                        [href]="'data:application/octet-stream;base64,' + file['file'] | filePipe"
                                        download="{{file['fileName']}}" data-toggle="tooltip"
                                        [title]="'Download '+ file['fileName']">{{ file?.fileName }}</a>


                                    <a *ngIf="file['fileName'].split('.').splice(-1) == 'pdf'"
                                        [href]="'data:application/pdf;base64,' + file['file'] | filePipe"
                                        download="{{file['fileName']}}" data-toggle="tooltip"
                                        [title]="'Download '+ file['fileName']" data-toggle="tooltip"
                                        [title]="'Download '+ file['fileName']">{{ file?.fileName }}</a>




                                    <a *ngIf="file['fileName'].split('.').splice(-1) == 'png'|| file['fileName'].split('.').splice(-1) == 'jpeg' || file['fileName'].split('.').splice(-1) == 'jpg'"
                                        [href]="'data:application/octet-stream;base64,' + file['file'] | filePipe"
                                        download="{{file['fileName']}}" data-toggle="tooltip"
                                        [title]="'Download '+ file['fileName']">{{ file?.fileName }}</a>


                                    <a *ngIf="file['fileName'].split('.').splice(-1) == 'txt'  ||file['fileName'].split('.').splice(-1) == 'pptx'|| file['fileName'].split('.').splice(-1) == 'docx'|| file['fileName'].split('.').splice(-1) == 'doc' || file['fileName'].split('.').splice(-1) == 'ppt'"
                                        [href]="'data:application/octet-stream;base64,' + file['file'] | filePipe"
                                        download="{{file['fileName']}}" data-toggle="tooltip"
                                        [title]="'Download '+ file['fileName']">{{ file?.fileName }}</a>
                                </p>
                            </a>
                        </span>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage" let-columns>
                <tr>
                    <td [attr.colspan]="5" style="text-align:center;">
                        No Records Found.
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="paginatorleft">
                <div  *ngIf="clientReferencesTable._totalRecords > 0">
                    <b>Showing {{clientReferencesTable.first+1}} to {{clientReferencesTable.first+clientReferencesTable.rows > clientReferencesTable.totalRecords?clientReferencesTable.totalRecords: clientReferencesTable.first+clientReferencesTable.rows}} of {{clientReferencesTable.totalRecords}}</b>
                </div>
            </ng-template>
        </p-table>


    </mat-expansion-panel>


    <mat-expansion-panel>

            <mat-panel-title>
                BANK DETAILS
            </mat-panel-title>
        </mat-expansion-panel-header>

                    <div class="panel-content-box">

                                    <label style=" font-size: medium; font-weight: bolder;"
                                        class="col-sm-6 col-form-label">BANK NAME</label>
                                    <div class="col-sm-6 content-values">
                                        {{bankdetails.bankName}}
                                    </div>
                                </div>
                                <div class="form-group row" style="margin-left: 5px;">
                                    <label for="deptName" style="font-size: medium; font-weight: bolder;"
                                        class="col-sm-6 col-form-label">BRANCH NAME</label>
                                    <div class="col-sm-6 content-values">
                                        {{bankdetails.branchName}}
                                    </div>
                                </div>


                            </div>
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label for="deptName" style="font-size: medium; font-weight: bolder;"
                                        class="col-sm-6 col-form-label">ACCOUNT NUMBER</label>
                                    <div class="col-sm-6 content-values">
                                        {{bankdetails.accountNumber}}
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label for="prCorrespondend" style="font-size: medium; font-weight: bolder;"
                                        class="col-sm-6 col-form-label">IFSC CODE</label>
                                    <div class="col-sm-6 content-values">
                                        {{bankdetails.ifscCode}}
                                    </div>
                                </div>


                            </div>
                        </div>
                        <div class="content-value" *ngIf="vendorRegData?.orgBankDetails.length == 0">
                            <p style="padding-left: 10px;margin: 8px;">No Records uploaded.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </mat-expansion-panel>

    <mat-expansion-panel>
        <mat-expansion-panel-header>
            <mat-panel-title>
                TURNOVER
            </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="panel panel-default">
            <div class="panel-body">
                <div class="view-details-panel-cls">
                    <div class="panel-content-box">

                            <hr *ngIf="i>0">
                            <div class="col-sm-6">
                                <div class="form-group row" style="margin-left: 5px;">

                                    <label for="deptName" style="font-size: medium; font-weight: bolder;"
                                        class="col-sm-6 col-form-label">AMOUNT</label>
                                    <div class="col-sm-6 content-values">
                                        {{turnover.amount}}
                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="content-value" *ngIf="vendorRegData?.orgTurnOver.length == 0">
                            <p style="padding-left: 10px;margin: 8px;">
                                No Records uploaded.</p>
                        </div>
                    </div>

        </div>

    <mat-expansion-panel>

                DOCUMENTS

        </mat-expansion-panel-header>

        <div class="panel panel-default" style="margin-top: 20px;">
            <div class="panel-body">
                <div class="view-details-panel-cls">
                    <div class="panel-content-box">
                        <mat-card *ngIf="vendorRegData?.documents.length">
                            <div class="form-group row" style="margin: 12px;"

                                <div class="col-sm-6 ">
                                    <p *ngIf="file['fileName']" style="margin-bottom: 0px;"> Download Attachment
                                        &nbsp;&nbsp;

                                        <a *ngIf="file['fileName'].split('.').splice(-1) == 'xlsx' || file['fileName'].split('.').splice(-1) == 'xls' || file['fileName'].split('.').splice(-1) == 'csv'"
