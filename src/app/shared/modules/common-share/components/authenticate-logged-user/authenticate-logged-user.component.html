<div class="modal-header">
    <h3>User Authentication</h3>
    <button class="btn-skelton modal-close-btn" mat-dialog-close>✖</button>
</div>
<div class="modal-body">
<div class="form">
    <form [formGroup]="authForm" (ngSubmit)="onAuthenticate()"   autocomplete="off" novalidate>

        <div class="form-group">
            <label>User Email Id</label>
            <input type="email" class="form-control" disabled formControlName="email" placeholder="User Email Id" />
        </div>
        <div class="form-group">
            <label>Email Password <i class="fa fa-info-circle" data-toggle="tooltip" title="Enter Your Mail Password"
                    aria-hidden="true" >
                </i></label>
            <input type="password" formControlName="password"  placeholder="Enter Your Mail Password"
                class="form-control" />
        </div>
        <div class="input-group mt-4 " style="justify-content: right;">
            <button class="btn btn-blue" [disabled]="!authForm.valid">Authenticate</button>
            <button class="btn btn-red" (click)="resetForm()">Reset</button>
        </div>
    </form>
</div>
</div>
