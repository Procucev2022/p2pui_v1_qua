<div class="modal-header">
    <div class="modal-title-wrap">
        <h4>{{isVendor ? 'Seller' : 'Buyer'}} Info</h4>
        <button *ngIf="!isEditing && vendorInfo" type="button" class="btn btn-outline-primary btn-sm edit-btn" (click)="startEdit()" title="Edit Info">
            <i class="fa fa-pencil"></i> Edit
        </button>
    </div>
    <button class="btn-skelton modal-close-btn" mat-dialog-close>✖</button>
</div>

<!-- READ-ONLY VIEW -->
<div class="modal-body" *ngIf="vendorInfo && !isEditing">
    <div class="form-group">
        <label><b>Company Name</b></label>
        <label>{{vendorInfo?.companyName ? vendorInfo.companyName : selectedVendor?.vendorName ? selectedVendor.vendorName : selectedVendor?.companyName ? selectedVendor.companyName : '-'}}</label>
    </div>
    <div class="form-group">
        <label><b>EmailId</b></label>
        <label>{{vendorInfo.email || '-'}}</label>
    </div>
    
    <div class="form-group">
        <label><b>Phone Number</b></label>
        <label>{{vendorInfo.organizationPhonenumber || '-'}}</label>
    </div>

    <div class="form-group" *ngIf="isVendor">
        <label><b>Seller Class</b></label>
        <label>{{vendorInfo.class ? vendorInfo.class : '-'}}</label>
    </div>
    
    <div class="form-group">
        <label><b>Zip Code</b></label>
        <label>{{vendorInfo.zipCode ? vendorInfo.zipCode : '-'}}</label>
    </div>
    <div class="form-group">
        <label><b>City</b></label>
        <label>{{vendorInfo.city ? vendorInfo.city : '-'}}</label>
    </div>
    <div class="form-group">
        <label><b>Categories</b></label>
        <label></label>
    </div>
    <div class="categories-list">
        <span *ngFor="let category of vendorInfo.categories">{{category}}</span>
    </div>
    <div class="empty-category" *ngIf="!vendorInfo.categories || vendorInfo.categories.length === 0">No Categories Found</div>
</div>

<!-- EDIT VIEW -->
<div class="modal-body edit-modal-body" *ngIf="vendorInfo && isEditing">
    <form [formGroup]="editForm" (ngSubmit)="saveVendorInfo()">
        <div class="edit-form-group">
            <label class="edit-label"><b>Company Name <span class="text-danger">*</span></b></label>
            <input type="text" class="form-control form-control-sm" formControlName="companyName" placeholder="Enter Company Name" />
            <small class="text-danger" *ngIf="editForm.get('companyName')?.touched && editForm.get('companyName')?.invalid">
                Company Name is required
            </small>
        </div>

        <div class="edit-form-group">
            <label class="edit-label"><b>EmailId <span class="text-danger">*</span></b></label>
            <input type="email" class="form-control form-control-sm" formControlName="email" placeholder="Enter Email" />
            <small class="text-danger" *ngIf="editForm.get('email')?.touched && editForm.get('email')?.invalid">
                Valid Email is required
            </small>
        </div>

        <div class="edit-form-group">
            <label class="edit-label"><b>Phone Number</b></label>
            <input type="text" class="form-control form-control-sm" formControlName="organizationPhonenumber" placeholder="Enter Phone Number" />
        </div>

        <div class="edit-form-group">
            <label class="edit-label"><b>Zip Code</b></label>
            <input type="text" class="form-control form-control-sm" formControlName="zipCode" placeholder="Enter Zip Code" />
        </div>

        <div class="edit-form-group">
            <label class="edit-label"><b>City</b></label>
            <input type="text" class="form-control form-control-sm" formControlName="city" placeholder="Enter City" />
        </div>

        <div class="edit-actions">
            <button type="button" class="btn btn-secondary btn-sm" (click)="cancelEdit()" [disabled]="isSaving">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSaving || editForm.invalid">
                <span *ngIf="isSaving"><i class="fa fa-spinner fa-spin"></i> Saving...</span>
                <span *ngIf="!isSaving"><i class="fa fa-save"></i> Save</span>
            </button>
        </div>
    </form>
</div>

<div *ngIf="!vendorInfo">
    No Details Found
</div>
