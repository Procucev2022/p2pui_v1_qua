<div class="modal-header">
    <h4>Seller Info</h4>
    <button class="btn-skelton modal-close-btn" mat-dialog-close>✖</button>
</div>
<div class="modal-body" *ngIf="vendorInfo">
    <div class="form-group">
        <label><b>Company Name</b></label>
        <label>{{selectedVendor?.vendorName ? selectedVendor.vendorName :  selectedVendor?.companyName ? selectedVendor.companyName : '-'}}</label>
    </div>
    <div class="form-group">
        <label><b>EmailId</b></label>
        <label>{{vendorInfo.email}}</label>
    </div>
    
    
    <div class="form-group">
        <label><b>Bussiness Age</b></label>
        <label>{{vendorInfo.bussinessAge ? vendorInfo.bussinessAge: '-'}}</label>
    </div>
    <div class="form-group">
        <label><b> Phone Number</b></label>
        <label>{{vendorInfo.organizationPhonenumber}}</label>
    </div>

    <div class="form-group">
        <label><b>Vendor Class</b></label>
        <label>{{vendorInfo.vendorClass ? vendorInfo.vendorClass : vendorInfo?.details ? vendorInfo.details : '-'}}</label>
    </div>
    
    <div class="form-group">
        <label><b>Zip Code</b></label>
        <label>{{vendorInfo.zipCode ? vendorInfo.zipCode : '-'}}</label>
    </div>
    <div class="form-group">
        <label><b>Categories</b></label>
        <label></label>
      
    </div>
      <div class="categories-list"> <span *ngFor="let category of vendorInfo.categories">{{category}}</span></div>
      <div class="empty-category" *ngIf="!vendorInfo.categories || vendorInfo.categories.length === 0">No Categories Found</div>
</div>
<div *ngIf="!vendorInfo">
    No Details Found
</div>
