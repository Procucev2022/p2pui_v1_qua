<div class="modal-header">
    <button class="btn btn-warning modal-close-btn" mat-dialog-close>✖</button>
    <div class="col-12">
        <h5 class="title-trim-cls" [title]="graphTitle" tooltipPosition="bottom">Price Trend Analytics for :  <b >{{ graphTitle  }}</b> </h5>
    </div>
</div>
<div class="modal-body">
    <div class="row"  >

        <div class="col-12" *ngIf="rowData">
            <app-price-trend-chart [rowData]="rowData" [isItemLevel]="!rowData?.isVendorLevel"></app-price-trend-chart>
        </div>
    </div>
</div>
