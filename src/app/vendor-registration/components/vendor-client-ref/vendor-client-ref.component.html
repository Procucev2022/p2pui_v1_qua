<div class="col-12">
  <div class="row">

    <div class="col-12 page-title-pane">
      <h5>Add Client Reference</h5>
    </div>
    <div class="col-12 page-body-pane">
      <div class="prqContainer row">
        <div class="col-12">

          <form class="form-horizontal" name="addVendorCliRef" (ngSubmit)="onSubmit()" #addVendorCliRef="ngForm"
            novalidate>
            <!-- <div class="form-group row">

              <button type="button" mat-raised-button color="warn" (click)="addVendorCliRef.reset()">Reset</button>

            </div> -->

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">Company Name</label>
                <div class="col-sm-8">
                  <input type="text" name="name" class="form-control" [(ngModel)]="model.name" #name="ngModel"
                    id="i_name" placeholder="Name">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">Email</label>
                <div class="col-sm-8">
                  <input type="text" name="email" class="form-control" [(ngModel)]="model.email" #email="ngModel"
                    id="i_email" placeholder="Email">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">POC First Name</label>
                <div class="col-sm-8">
                  <input type="text" name="pocFirstName" class="form-control" [(ngModel)]="model.pocFirstName"
                    #pocFirstName="ngModel" id="i_poc_first_name" placeholder="POC First Name">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">POC Last Name</label>
                <div class="col-sm-8">
                  <input type="text" name="pocLastName" class="form-control" [(ngModel)]="model.pocLastName"
                    #pocLastName="ngModel" id="i_poc_last_name" placeholder="POC Last Name">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">Phone</label>
                <div class="col-sm-8">
                  <input type="text" name="phone" class="form-control" [(ngModel)]="model.phone" #phone="ngModel"
                    id="i_phone" placeholder="Phone">
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label class="control-label col-sm-4" for="text">Comments</label>
                <div class="col-sm-8">
                  <textarea type="text" name="comments" class="form-control" [(ngModel)]="model.comments"
                    #comments="ngModel" id="i_comments" placeholder="Comments"></textarea>
                </div>
              </div>
            </div>

            <div class="form-group">
              <div class="row">
                <label for="text" class="control-label col-sm-4">File</label>
                <div class="col-sm-8">
                  <input type="file" multiple name="file" class="form-control" id="fileupload" [(ngModel)]="model.file"
                    #file="ngModel" placeholder="Browse Your Files" name="file" (change)="onFileUpload($event)">
                </div>
              </div>
            </div>

            <br>
            <mat-dialog-actions align="end">
              <button type="button" mat-raised-button color="warn" (click)="addVendorCliRef.reset()">Reset</button>
              <button mat-raised-button color="primary" cdkFocusInitial type="submit">Submit</button>
              <button mat-raised-button color="warn" (click)="closeDialog()" mat-dialog-close>Cancel</button>
            </mat-dialog-actions>
          </form>




        </div>
      </div>
    </div>
  </div>
</div>
